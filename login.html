<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập — MyLibrary</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Nền riêng cho trang auth */
        body {
            background: radial-gradient(ellipse at 30% 20%, rgba(88,120,255,0.1) 0%, transparent 55%),
                        #0d1117;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">📚 MyLibrary</a>
            <div class="ms-auto d-flex gap-2">
                <a href="index.html" class="btn btn-link text-white-50 text-decoration-none btn-sm">Trang chủ</a>
                <a href="register.html" class="btn btn-gold btn-sm px-3">Đăng ký</a>
            </div>
        </div>
    </nav>

    <!-- MAIN -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="auth-card">

            <!-- Logo -->
            <div class="text-center mb-4">
                <div class="fs-2 mb-1">📚</div>
                <span class="fw-bold" style="font-family:'Playfair Display',serif; color:#f5a623; font-size:1.2rem;">MyLibrary</span>
            </div>

            <h1 class="fs-4 fw-bold text-center mb-1" style="color:#f0f6fc;">Chào mừng trở lại</h1>
            <p class="text-center mb-4 small" style="color:#8b949e;">Đăng nhập để tiếp tục hành trình đọc sách</p>

            <!-- Form -->
            <form id="loginForm" novalidate>
                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">Địa chỉ Email</label>
                    <input type="email" class="form-control" id="email"
                           placeholder="name@example.com" autocomplete="email">
                    <div class="invalid-feedback">Vui lòng nhập email hợp lệ.</div>
                </div>

                <!-- Mật khẩu -->
                <div class="mb-1">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="password" class="form-label mb-0">Mật khẩu</label>
                        <a href="#" class="small text-decoration-none" style="color:#7b9fff;">Quên mật khẩu?</a>
                    </div>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password"
                               placeholder="••••••••" autocomplete="current-password">
                        <button class="btn btn-outline-secondary" type="button" id="togglePw">👁</button>
                    </div>
                    <div class="text-danger small mt-1 d-none" id="passwordError">Vui lòng nhập mật khẩu.</div>
                </div>

                <button type="submit" class="btn btn-gold w-100 mt-4 py-2">Đăng nhập</button>
            </form>

            <p class="text-center mt-4 small" style="color:#8b949e;">
                Chưa có tài khoản?
                <a href="register.html" class="fw-bold text-decoration-none" style="color:#f5a623;">Đăng ký miễn phí →</a>
            </p>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="py-4">
        <div class="container">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
                <span class="fw-bold" style="font-family:'Playfair Display',serif; color:#c9d1d9; font-size:1.1rem;">📚 MyLibrary</span>
                <span style="color:#8b949e; font-size:0.8rem; letter-spacing:0.04em;">Nền tảng quản lý sách cá nhân &nbsp;·&nbsp; VKU</span>
                <span style="color:#6e7681; font-size:0.8rem;">© 2026 MyLibrary</span>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Nếu đã đăng nhập rồi thì chuyển thẳng vào thư viện
        if (sessionStorage.getItem('isLoggedIn')) {
            window.location.href = 'library.html';
        }

        // Toggle hiện / ẩn mật khẩu
        document.getElementById('togglePw').addEventListener('click', function () {
            const input = document.getElementById('password');
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            this.textContent = isHidden ? '🙈' : '👁';
        });

        // Xử lý form
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const email    = document.getElementById('email');
            const password = document.getElementById('password');
            const pwError  = document.getElementById('passwordError');
            let valid = true;

            // Kiểm tra email
            if (!email.value.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
                email.classList.add('is-invalid');
                valid = false;
            } else {
                email.classList.remove('is-invalid');
            }

            // Kiểm tra mật khẩu
            if (!password.value) {
                pwError.classList.remove('d-none');
                password.classList.add('is-invalid');
                valid = false;
            } else {
                pwError.classList.add('d-none');
                password.classList.remove('is-invalid');
            }

            if (valid) {
                sessionStorage.setItem('isLoggedIn', '1');
                alert('Đăng nhập thành công! Đang chuyển đến thư viện...');
                window.location.href = 'library.html';
            }
        });

        // Xóa lỗi khi người dùng gõ lại
        document.getElementById('email').addEventListener('input', function () {
            this.classList.remove('is-invalid');
        });
        document.getElementById('password').addEventListener('input', function () {
            this.classList.remove('is-invalid');
            document.getElementById('passwordError').classList.add('d-none');
        });
    </script>
</body>
</html>
